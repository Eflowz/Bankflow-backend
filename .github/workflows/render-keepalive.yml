name: Keep Render API warm

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-api-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render health endpoint
        env:
          HEALTH_URL: https://bankflow-backend-wfxb.onrender.com/health
        run: |
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 100 \
            "$HEALTH_URL")"
          printf 'Render health response: %s\n' "$response"
          printf '%s' "$response" | grep -q '"status":"ok"'
